version: "3.8"
services:
  app:
    build: .
    container_name: tte_app
    environment:
      - TTE_START_SIMULATOR=true
    ports:
      - "8000:80"
    depends_on:
      - influxdb

  influxdb:
    image: influxdb:2.7
    container_name: tte_influx
    environment:
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=adminpass
      - INFLUXDB_DB=tte
    ports:
      - "8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:10.0.0
    container_name: tte_grafana
    ports:
      - "3000:3000"
    depends_on:
      - influxdb

volumes:
  influx_data:
